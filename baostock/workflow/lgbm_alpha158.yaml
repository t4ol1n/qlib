# QLib workflow config: Alpha158 + LightGBM + TopkDropoutStrategy on the baostock HS300 dump.
#
# This is the declarative equivalent of `run_workflow.py` (kept for reference and for
# `qrun` usage). The primary entry point is `run_workflow.py`, which reads `config.py`,
# applies CLI overrides, and additionally exports selection / metrics / charts to output/.
#
# Run from the QLib repo root (so the relative provider_uri resolves):
#   conda run -n baostock_qlib qrun baostock/workflow/lgbm_alpha158.yaml
#
# NOTE: `qrun` will NOT produce output/selected_stocks_latest.csv, metrics.json or the
# HTML charts -- use run_workflow.py for those.

qlib_init:
    provider_uri: "baostock/data/qlib_bin"
    region: cn
market: &market csi300
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
    start_time: 2014-01-01
    end_time: 2024-12-31
    fit_start_time: 2014-01-01
    fit_end_time: 2019-12-31
    instruments: *market
port_analysis_config: &port_analysis_config
    executor:
        class: SimulatorExecutor
        module_path: qlib.backtest.executor
        kwargs:
            time_per_step: day
            generate_portfolio_metrics: True
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy.signal_strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2022-01-01
        end_time: 2024-12-31
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            freq: day
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.0421
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 8
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2014-01-01, 2019-12-31]
                valid: [2020-01-01, 2021-12-31]
                test: [2022-01-01, 2024-12-31]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
